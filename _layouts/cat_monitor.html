<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Monitor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      color: white;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .section-label {
      width: 100%;
      padding: 10px 16px;
      background: #111;
      font-size: 13px;
      font-weight: bold;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .images-wrap {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      background: #000;
    }

    .image-box {
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    .camera-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: #000;
    }

    .sightings-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
      padding: 6px;
      background: #000;
    }

    .sighting-tile {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.12s ease, border-color 0.12s ease;
    }

    .sighting-tile:hover {
      transform: scale(1.015);
      border-color: #555;
    }

    .sighting-tile:focus-visible {
      outline: 3px solid white;
      outline-offset: -3px;
    }

    .sighting-image {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: white;
    }

    .sighting-rank {
      position: absolute;
      right: 6px;
      bottom: 6px;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.72);
      color: white;
      font-size: 10px;
      font-weight: bold;
      pointer-events: none;
    }


    /* --------------------------------------------------
       FULLSCREEN RECENT-SIGHTINGS GALLERY
       -------------------------------------------------- */

    .gallery-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.96);
      overflow: hidden;
      touch-action: pan-y;
    }

    .gallery-overlay.open {
      display: flex;
    }

    .gallery-stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 74px 54px;
    }

    .gallery-image {
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      background: #000;
      user-select: none;
      -webkit-user-drag: none;
    }

    .gallery-close,
    .gallery-nav {
      position: absolute;
      z-index: 10001;
      border: 0;
      color: white;
      background: rgba(20, 20, 20, 0.72);
      cursor: pointer;
      font-family: Arial, sans-serif;
      line-height: 1;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .gallery-close:hover,
    .gallery-nav:hover {
      background: rgba(55, 55, 55, 0.9);
    }

    .gallery-close:focus-visible,
    .gallery-nav:focus-visible {
      outline: 3px solid white;
      outline-offset: 2px;
    }

    .gallery-close {
      top: 14px;
      right: 14px;
      min-width: 48px;
      height: 48px;
      padding: 0 15px;
      border-radius: 24px;
      font-size: 30px;
    }

    .gallery-nav {
      top: 50%;
      width: 56px;
      height: 72px;
      margin-top: -36px;
      border-radius: 8px;
      font-size: 46px;
      font-weight: normal;
    }

    .gallery-prev {
      left: 12px;
    }

    .gallery-next {
      right: 12px;
    }

    .gallery-counter {
      position: absolute;
      z-index: 10001;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      padding: 7px 12px;
      border-radius: 14px;
      background: rgba(20, 20, 20, 0.72);
      color: #ddd;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
    }

    body.gallery-open {
      overflow: hidden;
    }

    .heatmap-box {
      width: 100%;
      padding: 8px;
      background: #000;
    }

    .heatmap-image {
      display: block;
      width: 100%;
      height: auto;
      background: white;
      object-fit: contain;
      border-radius: 6px;
    }

    @media (max-width: 700px) {
      .sightings-grid {
        gap: 3px;
        padding: 3px;
      }

      .sighting-rank {
        right: 3px;
        bottom: 3px;
        padding: 2px 4px;
        font-size: 8px;
      }


      .gallery-stage {
        padding: 54px 48px 50px;
      }

      .gallery-nav {
        width: 42px;
        height: 64px;
        margin-top: -32px;
        font-size: 38px;
      }

      .gallery-prev {
        left: 4px;
      }

      .gallery-next {
        right: 4px;
      }

      .gallery-close {
        top: 8px;
        right: 8px;
        min-width: 44px;
        height: 44px;
        padding: 0 12px;
        font-size: 27px;
      }

      .gallery-counter {
        bottom: 9px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- LIVE VIEW -->
    <div class="section-label">Live View</div>
    <div class="images-wrap">
      <div class="image-box">
        <img
          id="main-image"
          class="camera-image"
          alt="Live Camera"
        />
      </div>
    </div>

    <!-- RECENT CAT SIGHTINGS -->
    <div class="section-label">
      Recent Cat Sightings — newest to oldest
    </div>

    <div class="sightings-grid">
      <div class="sighting-tile" data-gallery-index="0" role="button" tabindex="0" aria-label="Open latest cat sighting">
        <img
          id="cat-sighting-1"
          class="sighting-image"
          alt="Latest cat sighting"
        />
        <div class="sighting-rank">Latest</div>
      </div>

      <div class="sighting-tile" data-gallery-index="1" role="button" tabindex="0" aria-label="Open cat sighting 2">
        <img
          id="cat-sighting-2"
          class="sighting-image"
          alt="Cat sighting 2"
        />
        <div class="sighting-rank">2</div>
      </div>

      <div class="sighting-tile" data-gallery-index="2" role="button" tabindex="0" aria-label="Open cat sighting 3">
        <img
          id="cat-sighting-3"
          class="sighting-image"
          alt="Cat sighting 3"
        />
        <div class="sighting-rank">3</div>
      </div>

      <div class="sighting-tile" data-gallery-index="3" role="button" tabindex="0" aria-label="Open cat sighting 4">
        <img
          id="cat-sighting-4"
          class="sighting-image"
          alt="Cat sighting 4"
        />
        <div class="sighting-rank">4</div>
      </div>

      <div class="sighting-tile" data-gallery-index="4" role="button" tabindex="0" aria-label="Open oldest recent cat sighting">
        <img
          id="cat-sighting-5"
          class="sighting-image"
          alt="Oldest recent cat sighting"
        />
        <div class="sighting-rank">5</div>
      </div>
    </div>

    <!-- CAT ACTIVITY / HEATMAP -->
    <div class="section-label">Cat Activity</div>

    <div class="heatmap-box">
      <img
        id="heatmap-image"
        class="heatmap-image"
        alt="Cat Activity Heatmap"
      />
    </div>

  </div>


  <!-- FULLSCREEN RECENT CAT SIGHTINGS GALLERY -->
  <div
    id="gallery-overlay"
    class="gallery-overlay"
    role="dialog"
    aria-modal="true"
    aria-label="Recent Cat Sightings gallery"
    aria-hidden="true"
  >
    <div
      id="gallery-stage"
      class="gallery-stage"
    >
      <img
        id="gallery-image"
        class="gallery-image"
        alt="Cat sighting enlarged"
      />
    </div>

    <button
      id="gallery-close"
      class="gallery-close"
      type="button"
      aria-label="Exit gallery view"
      title="Exit gallery view"
    >×</button>

    <button
      id="gallery-prev"
      class="gallery-nav gallery-prev"
      type="button"
      aria-label="Previous sighting"
      title="Previous sighting"
    >‹</button>

    <button
      id="gallery-next"
      class="gallery-nav gallery-next"
      type="button"
      aria-label="Next sighting"
      title="Next sighting"
    >›</button>

    <div
      id="gallery-counter"
      class="gallery-counter"
      aria-live="polite"
    ></div>
  </div>

  <script>
    // --------------------------------------------------
    // GOOGLE DRIVE IMAGE IDS
    // --------------------------------------------------

    const LIVE_DRIVE_ID =
      "1ylnOsWs3prkiBh0Hgla9pVikjnORba-i";

    /*
      This was previously called TIMELAPSE_DRIVE_ID.
      That Drive file is now the Cat Activity heatmap.
      MGM_cat_heatmap.py writes PNG image data into it.
    */
    const HEATMAP_DRIVE_ID =
      "10VCEPnwHztf655SuBe3VmxzXE5P4YeO6";

    const CAT_SIGHTING_DRIVE_IDS = [
      "1vX3Xpp61fxR7p9b74AUs_ORi-9WzmIIh",
      "1BeOogvsuiLzAdfirIhfWODZEDrrlt--M",
      "1BxXs1uXWEDfP1vh1L0J8CBsWGzrggcsE",
      "1AUWnURBSrE1B4WMXhs-iKSscDR1z8EXo",
      "1aAwCe-0vN4pnw-3rx_7Uj9A0Ugm5BuiU"
    ];

    // --------------------------------------------------
    // IMAGE CONFIG
    // --------------------------------------------------

    const LIVE_IMAGE = {
      driveId: LIVE_DRIVE_ID,
      imgId: "main-image"
    };

    const HEATMAP_IMAGE = {
      driveId: HEATMAP_DRIVE_ID,
      imgId: "heatmap-image"
    };

    const CAT_SIGHTING_IMAGES =
      CAT_SIGHTING_DRIVE_IDS.map((driveId, index) => ({
        driveId,
        imgId: `cat-sighting-${index + 1}`
      }));

    const IMAGES = [
      LIVE_IMAGE,
      ...CAT_SIGHTING_IMAGES,
      HEATMAP_IMAGE
    ];

    // Keep track of current blob URLs.
    const activeBlobUrls = {};


    // --------------------------------------------------
    // FULLSCREEN RECENT-SIGHTINGS GALLERY
    // --------------------------------------------------

    let galleryIndex = 0;
    let galleryIsOpen = false;
    let galleryTouchStartX = null;

    function getGalleryElements() {
      return {
        overlay: document.getElementById("gallery-overlay"),
        image: document.getElementById("gallery-image"),
        counter: document.getElementById("gallery-counter"),
        close: document.getElementById("gallery-close"),
        prev: document.getElementById("gallery-prev"),
        next: document.getElementById("gallery-next"),
        stage: document.getElementById("gallery-stage")
      };
    }

    function normaliseGalleryIndex(index) {
      const total = CAT_SIGHTING_IMAGES.length;
      return ((index % total) + total) % total;
    }

    function showGalleryImage(index) {
      const elements = getGalleryElements();
      galleryIndex = normaliseGalleryIndex(index);

      const config = CAT_SIGHTING_IMAGES[galleryIndex];
      const sourceImage = document.getElementById(config.imgId);

      if (sourceImage && sourceImage.src) {
        elements.image.src = sourceImage.src;
        elements.image.alt =
          sourceImage.alt || `Cat sighting ${galleryIndex + 1}`;
      }

      const label =
        galleryIndex === 0
          ? "Latest"
          : `${galleryIndex + 1} of ${CAT_SIGHTING_IMAGES.length}`;

      elements.counter.textContent =
        `${label} — ${galleryIndex + 1} / ${CAT_SIGHTING_IMAGES.length}`;
    }

    function openGallery(index) {
      const elements = getGalleryElements();

      galleryIsOpen = true;
      showGalleryImage(index);

      elements.overlay.classList.add("open");
      elements.overlay.setAttribute("aria-hidden", "false");
      document.body.classList.add("gallery-open");

      // Put keyboard focus on the close button.
      elements.close.focus({ preventScroll: true });
    }

    function closeGallery() {
      if (!galleryIsOpen) {
        return;
      }

      const elements = getGalleryElements();

      galleryIsOpen = false;
      elements.overlay.classList.remove("open");
      elements.overlay.setAttribute("aria-hidden", "true");
      document.body.classList.remove("gallery-open");

      const tile =
        document.querySelector(
          `.sighting-tile[data-gallery-index="${galleryIndex}"]`
        );

      if (tile) {
        tile.focus({ preventScroll: true });
      }
    }

    function previousGalleryImage() {
      showGalleryImage(galleryIndex - 1);
    }

    function nextGalleryImage() {
      showGalleryImage(galleryIndex + 1);
    }

    function initGallery() {
      const elements = getGalleryElements();

      document
        .querySelectorAll(".sighting-tile")
        .forEach((tile) => {
          const index =
            Number(tile.dataset.galleryIndex);

          tile.addEventListener(
            "click",
            () => openGallery(index)
          );

          tile.addEventListener(
            "keydown",
            (event) => {
              if (
                event.key === "Enter" ||
                event.key === " "
              ) {
                event.preventDefault();
                openGallery(index);
              }
            }
          );
        });

      elements.close.addEventListener(
        "click",
        closeGallery
      );

      elements.prev.addEventListener(
        "click",
        previousGalleryImage
      );

      elements.next.addEventListener(
        "click",
        nextGalleryImage
      );

      // Clicking the black area outside the image exits gallery view.
      elements.stage.addEventListener(
        "click",
        (event) => {
          if (event.target === elements.stage) {
            closeGallery();
          }
        }
      );

      document.addEventListener(
        "keydown",
        (event) => {
          if (!galleryIsOpen) {
            return;
          }

          if (event.key === "Escape") {
            event.preventDefault();
            closeGallery();
          } else if (event.key === "ArrowLeft") {
            event.preventDefault();
            previousGalleryImage();
          } else if (event.key === "ArrowRight") {
            event.preventDefault();
            nextGalleryImage();
          }
        }
      );

      // Simple swipe navigation on phones/tablets.
      elements.overlay.addEventListener(
        "touchstart",
        (event) => {
          if (event.touches.length === 1) {
            galleryTouchStartX =
              event.touches[0].clientX;
          }
        },
        { passive: true }
      );

      elements.overlay.addEventListener(
        "touchend",
        (event) => {
          if (
            galleryTouchStartX === null ||
            event.changedTouches.length !== 1
          ) {
            galleryTouchStartX = null;
            return;
          }

          const endX =
            event.changedTouches[0].clientX;

          const deltaX =
            endX - galleryTouchStartX;

          galleryTouchStartX = null;

          if (Math.abs(deltaX) < 50) {
            return;
          }

          if (deltaX > 0) {
            previousGalleryImage();
          } else {
            nextGalleryImage();
          }
        },
        { passive: true }
      );
    }

    function syncOpenGalleryImage(imgElement, newSrc) {
      if (!galleryIsOpen) {
        return;
      }

      const currentConfig =
        CAT_SIGHTING_IMAGES[galleryIndex];

      if (
        currentConfig &&
        imgElement.id === currentConfig.imgId
      ) {
        const galleryImage =
          document.getElementById("gallery-image");

        galleryImage.src = newSrc;
      }
    }

    // --------------------------------------------------
    // DRIVE URLS
    // --------------------------------------------------

    function generateAllPossibleUrls(driveId) {
      const timestamp = Date.now();

      const randomParam =
        Math.random()
          .toString(36)
          .substring(2, 10);

      return [
        `https://lh3.googleusercontent.com/d/${driveId}=w2000&t=${timestamp}&r=${randomParam}`,
        `https://drive.google.com/uc?id=${driveId}&export=download&t=${timestamp}&r=${randomParam}`,
        `https://lh3.googleusercontent.com/d/${driveId}?t=${timestamp}&r=${randomParam}`
      ];
    }

    // --------------------------------------------------
    // FALLBACK CORS PROXIES
    // --------------------------------------------------

    function getCORSProxies() {
      return [
        'https://api.allorigins.win/raw?url=',
        'https://api.codetabs.com/v1/proxy?quest=',
        'https://corsproxy.io/?',
        'https://thingproxy.freeboard.io/fetch/'
      ];
    }

    // --------------------------------------------------
    // FETCH IMAGE
    // --------------------------------------------------

    async function extremeFetchImage(
      driveId,
      isRefresh = false
    ) {
      const urls =
        generateAllPossibleUrls(driveId);

      // Try Google URLs directly first.
      for (const url of urls) {
        try {
          const response =
            await fetch(
              url,
              {
                mode: 'cors',
                credentials: 'omit',
                referrerPolicy: 'no-referrer',
                cache: 'no-store'
              }
            );

          if (response.ok) {
            const blob =
              await response.blob();

            if (
              blob.size > 0 &&
              blob.type.startsWith('image/')
            ) {
              return URL.createObjectURL(blob);
            }
          }
        } catch (e) {
          // Try next URL.
        }
      }

      /*
        During automatic refresh we don't use
        proxies. This prevents a slow proxy request
        every refresh cycle.
      */
      if (isRefresh) {
        return null;
      }

      // Initial load fallback through proxies.
      const proxies =
        getCORSProxies();

      for (const proxy of proxies) {
        for (const url of urls.slice(0, 2)) {
          try {
            const proxyUrl =
              proxy + encodeURIComponent(url);

            const response =
              await fetch(
                proxyUrl,
                {
                  cache: 'no-store'
                }
              );

            if (response.ok) {
              const blob =
                await response.blob();

              if (
                blob.size > 1000 &&
                blob.type.startsWith('image/')
              ) {
                return URL.createObjectURL(blob);
              }
            }
          } catch (e) {
            // Try next proxy.
          }
        }
      }

      return null;
    }

    // --------------------------------------------------
    // PRELOAD IMAGE
    // --------------------------------------------------

    function preloadImage(src) {
      return new Promise(
        (resolve, reject) => {
          const img =
            new Image();

          img.onload =
            () => resolve();

          img.onerror =
            reject;

          img.src =
            src;
        }
      );
    }

    // --------------------------------------------------
    // SWAP IMAGE WITHOUT FLASHING
    // --------------------------------------------------

    async function swapImageWithoutFlash(
      imgElement,
      newSrc,
      imgKey
    ) {
      try {
        await preloadImage(newSrc);

        const oldSrc =
          imgElement.src;

        imgElement.src =
          newSrc;

        syncOpenGalleryImage(
          imgElement,
          newSrc
        );

        if (
          activeBlobUrls[imgKey] &&
          activeBlobUrls[imgKey].startsWith('blob:') &&
          activeBlobUrls[imgKey] !== newSrc
        ) {
          URL.revokeObjectURL(
            activeBlobUrls[imgKey]
          );
        }

        activeBlobUrls[imgKey] =
          newSrc;

        if (
          oldSrc &&
          oldSrc.startsWith('blob:') &&
          oldSrc !== newSrc &&
          oldSrc !== activeBlobUrls[imgKey]
        ) {
          try {
            URL.revokeObjectURL(oldSrc);
          } catch (e) {}
        }
      } catch (error) {
        if (
          newSrc &&
          newSrc.startsWith('blob:')
        ) {
          URL.revokeObjectURL(newSrc);
        }
      }
    }

    // --------------------------------------------------
    // REFRESH ONE IMAGE
    // --------------------------------------------------

    async function refreshImage(
      imageConfig
    ) {
      const imgElement =
        document.getElementById(
          imageConfig.imgId
        );

      if (!imgElement) {
        return;
      }

      const newUrl =
        await extremeFetchImage(
          imageConfig.driveId,
          true
        );

      // If fetch failed, leave current image visible.
      if (!newUrl) {
        return;
      }

      await swapImageWithoutFlash(
        imgElement,
        newUrl,
        imageConfig.imgId
      );
    }

    // --------------------------------------------------
    // INITIAL LOAD
    // --------------------------------------------------

    async function loadInitialImages() {
      for (const imageConfig of IMAGES) {
        const imgElement =
          document.getElementById(
            imageConfig.imgId
          );

        const initialUrl =
          await extremeFetchImage(
            imageConfig.driveId,
            false
          );

        if (
          initialUrl &&
          imgElement
        ) {
          await swapImageWithoutFlash(
            imgElement,
            initialUrl,
            imageConfig.imgId
          );
        }
      }
    }

    // --------------------------------------------------
    // AUTO REFRESH
    // --------------------------------------------------

    function startAutoRefresh() {
      // Live camera: every 10 seconds.
      setInterval(
        () => {
          refreshImage(LIVE_IMAGE);
        },
        10000
      );

      // Recent cat sightings: every 30 seconds.
      setInterval(
        () => {
          CAT_SIGHTING_IMAGES.forEach(
            refreshImage
          );
        },
        30000
      );

      // Cat Activity heatmap: every 60 seconds.
      setInterval(
        () => {
          refreshImage(HEATMAP_IMAGE);
        },
        60000
      );
    }

    // --------------------------------------------------
    // START
    // --------------------------------------------------

    async function init() {
      initGallery();
      await loadInitialImages();
      startAutoRefresh();
    }

    window.addEventListener(
      'load',
      init
    );
  </script>

</body>
</html>
