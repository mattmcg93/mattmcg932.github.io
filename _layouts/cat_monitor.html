<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat Monitor</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      color: white;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .section-label {
      width: 100%;
      padding: 10px 16px;
      background: #111;
      font-size: 13px;
      font-weight: bold;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .images-wrap {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      background: #000;
    }

    .image-box {
      width: 100%;
      background: #000;
      overflow: hidden;
    }

    .camera-image {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>
  <div class="page">

    <!-- LIVE VIEW -->
    <div class="section-label">Live View</div>

    <div class="images-wrap">
      <div class="image-box">
        <img
          id="main-image"
          class="camera-image"
          alt="Live Camera"
        />
      </div>
    </div>

    <!-- DAILY TIMELAPSE -->
    <div
      class="section-label"
      id="timelapse-label"
    >
      Daily Timelapse
    </div>

    <div class="images-wrap">
      <div class="image-box">
        <img
          id="timelapse-image"
          class="camera-image"
          alt="Daily Timelapse"
        />
      </div>
    </div>

  </div>


  <script>
    // --------------------------------------------------
    // TIMELAPSE LABEL
    // --------------------------------------------------

    function setTimelapseLabel() {
      const now = new Date();

      const today = new Date(now);
      today.setHours(9, 0, 0, 0);

      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);

      const fmt = (d) =>
        d.toLocaleDateString(
          'en-GB',
          {
            day: 'numeric',
            month: 'short',
            year: 'numeric'
          }
        );

      document.getElementById('timelapse-label').textContent =
        `Daily Timelapse — 9am ${fmt(yesterday)} to 9am ${fmt(today)}`;
    }

    setTimelapseLabel();
  </script>


  <script>
    // --------------------------------------------------
    // GOOGLE DRIVE IMAGE IDS
    // --------------------------------------------------

    const LIVE_DRIVE_ID =
      "1ylnOsWs3prkiBh0Hgla9pVikjnORba-i";

    const TIMELAPSE_DRIVE_ID =
      "10VCEPnwHztf655SuBe3VmxzXE5P4YeO6";


    // --------------------------------------------------
    // IMAGE CONFIG
    // --------------------------------------------------

    const LIVE_IMAGE = {
      driveId: LIVE_DRIVE_ID,
      imgId: "main-image"
    };

    const TIMELAPSE_IMAGE = {
      driveId: TIMELAPSE_DRIVE_ID,
      imgId: "timelapse-image"
    };

    const IMAGES = [
      LIVE_IMAGE,
      TIMELAPSE_IMAGE
    ];


    // Keep track of current blob URLs
    const activeBlobUrls = {};


    // --------------------------------------------------
    // GENERATE CACHE-BUSTED GOOGLE DRIVE URLS
    // --------------------------------------------------

    function generateAllPossibleUrls(driveId) {
      const timestamp = Date.now();

      const randomParam =
        Math.random()
          .toString(36)
          .substring(2, 10);

      return [
        `https://lh3.googleusercontent.com/d/${driveId}=w2000&t=${timestamp}&r=${randomParam}`,

        `https://drive.google.com/uc?id=${driveId}&export=download&t=${timestamp}&r=${randomParam}`,

        `https://lh3.googleusercontent.com/d/${driveId}?t=${timestamp}&r=${randomParam}`
      ];
    }


    // --------------------------------------------------
    // FALLBACK CORS PROXIES
    // --------------------------------------------------

    function getCORSProxies() {
      return [
        'https://api.allorigins.win/raw?url=',
        'https://api.codetabs.com/v1/proxy?quest=',
        'https://corsproxy.io/?',
        'https://thingproxy.freeboard.io/fetch/'
      ];
    }


    // --------------------------------------------------
    // FETCH IMAGE
    // --------------------------------------------------

    async function extremeFetchImage(
      driveId,
      isRefresh = false
    ) {
      const urls =
        generateAllPossibleUrls(driveId);


      // Try Google URLs directly first
      for (const url of urls) {
        try {
          const response =
            await fetch(
              url,
              {
                mode: 'cors',
                credentials: 'omit',
                referrerPolicy: 'no-referrer',
                cache: 'no-store'
              }
            );

          if (response.ok) {
            const blob =
              await response.blob();

            if (
              blob.size > 0 &&
              blob.type.startsWith('image/')
            ) {
              return URL.createObjectURL(blob);
            }
          }

        } catch (e) {
          // Try next URL
        }
      }


      /*
        During automatic refresh we don't
        use proxies. This prevents a slow
        proxy request every 10 seconds.
      */

      if (isRefresh) {
        return null;
      }


      // Initial load fallback through proxies
      const proxies =
        getCORSProxies();

      for (const proxy of proxies) {

        for (const url of urls.slice(0, 2)) {

          try {
            const proxyUrl =
              proxy + encodeURIComponent(url);

            const response =
              await fetch(
                proxyUrl,
                {
                  cache: 'no-store'
                }
              );

            if (response.ok) {

              const blob =
                await response.blob();

              if (
                blob.size > 1000 &&
                blob.type.startsWith('image/')
              ) {
                return URL.createObjectURL(blob);
              }
            }

          } catch (e) {
            // Try next proxy
          }
        }
      }

      return null;
    }


    // --------------------------------------------------
    // PRELOAD IMAGE
    // --------------------------------------------------

    function preloadImage(src) {

      return new Promise(
        (resolve, reject) => {

          const img =
            new Image();

          img.onload =
            () => resolve();

          img.onerror =
            reject;

          img.src =
            src;
        }
      );
    }


    // --------------------------------------------------
    // SWAP IMAGE WITHOUT FLASHING
    // --------------------------------------------------

    async function swapImageWithoutFlash(
      imgElement,
      newSrc,
      imgKey
    ) {

      try {

        // Make sure new image fully loads first
        await preloadImage(newSrc);

        const oldSrc =
          imgElement.src;


        // Replace displayed image
        imgElement.src =
          newSrc;


        // Revoke previous stored blob
        if (
          activeBlobUrls[imgKey] &&
          activeBlobUrls[imgKey].startsWith('blob:') &&
          activeBlobUrls[imgKey] !== newSrc
        ) {

          URL.revokeObjectURL(
            activeBlobUrls[imgKey]
          );
        }


        activeBlobUrls[imgKey] =
          newSrc;


        // Clean up any other old blob
        if (
          oldSrc &&
          oldSrc.startsWith('blob:') &&
          oldSrc !== newSrc &&
          oldSrc !== activeBlobUrls[imgKey]
        ) {

          try {
            URL.revokeObjectURL(oldSrc);
          } catch (e) {}
        }

      } catch (error) {

        // New image failed to preload.
        // Keep old image visible.

        if (
          newSrc &&
          newSrc.startsWith('blob:')
        ) {
          URL.revokeObjectURL(newSrc);
        }
      }
    }


    // --------------------------------------------------
    // REFRESH ONE IMAGE
    // --------------------------------------------------

    async function refreshImage(
      imageConfig
    ) {

      const imgElement =
        document.getElementById(
          imageConfig.imgId
        );

      if (!imgElement) {
        return;
      }


      const newUrl =
        await extremeFetchImage(
          imageConfig.driveId,
          true
        );


      // If fetch failed, leave current image alone
      if (!newUrl) {
        return;
      }


      await swapImageWithoutFlash(
        imgElement,
        newUrl,
        imageConfig.imgId
      );
    }


    // --------------------------------------------------
    // INITIAL LOAD
    // --------------------------------------------------

    async function loadInitialImages() {

      for (const imageConfig of IMAGES) {

        const imgElement =
          document.getElementById(
            imageConfig.imgId
          );


        const initialUrl =
          await extremeFetchImage(
            imageConfig.driveId,
            false
          );


        if (
          initialUrl &&
          imgElement
        ) {

          await swapImageWithoutFlash(
            imgElement,
            initialUrl,
            imageConfig.imgId
          );
        }
      }
    }


    // --------------------------------------------------
    // AUTO REFRESH
    // --------------------------------------------------

    function startAutoRefresh() {

      /*
        TOP LIVE IMAGE
        Refresh every 10 seconds
      */

      setInterval(
        () => {
          refreshImage(LIVE_IMAGE);
        },
        10000
      );


      /*
        BOTTOM TIMELAPSE IMAGE
        Refresh every 60 seconds
      */

      setInterval(
        () => {
          refreshImage(TIMELAPSE_IMAGE);
        },
        60000
      );
    }


    // --------------------------------------------------
    // START
    // --------------------------------------------------

    async function init() {

      // Load both images immediately
      await loadInitialImages();

      // Then begin their separate refresh timers
      startAutoRefresh();
    }


    window.addEventListener(
      'load',
      init
    );
  </script>

</body>
</html>
